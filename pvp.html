<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Totem Huggers — PvP</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Alegreya:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body>
  <header class="image-banner">
    <h1><a href="index.html"><img src="images/banner.png" alt="Totem Huggers"></a></h1>
  </header>

  <nav class="menu" aria-label="Main menu">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="leaderboard.html">Leaderboard</a></li>
      <li><a href="pvp.html">PvP</a></li>
      <li><a href="roster.html">Roster</a></li>
    </ul>
  </nav>

  <main>
    <div class="notice" id="notice" hidden>
      <strong>Sample data.</strong> These are made-up players.
    </div>

    <section id="pvp">
      <h2>PvP</h2>
      <input type="search" id="pvp-search" class="search" placeholder="Search players…" aria-label="Search PvP players by name">
      <div class="table-wrap">
        <table>
          <thead><tr id="pvp-head"><th>Rank</th><th class="class-col">Race</th><th class="class-col">Class</th><th class="level-col">Level</th><th>Player</th></tr></thead>
          <tbody id="pvp-rows"></tbody>
          <tfoot id="pvp-no-match" hidden><tr><td colspan="8" class="no-match">No players match that name.</td></tr></tfoot>
        </table>
      </div>
      <p class="meta">Click a column heading to rank by it.</p>
    </section>

  </main>

  <footer id="updated"></footer>

<script src="app.js"></script>
</body>
</html>
